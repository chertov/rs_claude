<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Counter Demo - Rust + egui + WASM</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            font-size: 18px;
            color: #eee;
            text-align: center;
            max-width: 90%;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #log {
            margin-top: 20px;
            text-align: left;
            font-size: 12px;
            color: #aaa;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
        }

        #log .ok { color: #4f4; }
        #log .err { color: #f44; }
        #log .info { color: #4af; }
    </style>
</head>
<body>
    <div id="loading_text">
        <div class="spinner"></div>
        <p id="status">Loading...</p>
        <div id="log"></div>
    </div>
    <canvas id="the_canvas_id"></canvas>

    <script>
        function log(msg, type) {
            const logDiv = document.getElementById('log');
            const line = document.createElement('div');
            line.className = type || 'info';
            line.textContent = new Date().toLocaleTimeString() + ' ' + msg;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        window.onerror = function(msg, url, line, col, error) {
            log('JS Error: ' + msg, 'err');
            log('  at ' + url + ':' + line + ':' + col, 'err');
            if (error && error.stack) {
                log('  stack: ' + error.stack, 'err');
            }
            setStatus('Error! See log below');
            return false;
        };

        window.addEventListener('unhandledrejection', function(e) {
            log('Unhandled Promise: ' + e.reason, 'err');
            setStatus('Error! See log below');
        });

        log('Page loaded', 'ok');
        log('User Agent: ' + navigator.userAgent.substring(0, 50) + '...', 'info');
        log('WebGL support: ' + (!!window.WebGLRenderingContext), 'info');

        // Check WebGL2
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl2');
            log('WebGL2: ' + (gl ? 'supported' : 'NOT supported'), gl ? 'ok' : 'err');
        } catch(e) {
            log('WebGL2 check failed: ' + e, 'err');
        }
    </script>

    <link data-trunk rel="rust" data-wasm-opt="2"/>
</body>
</html>
